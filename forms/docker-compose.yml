# Deployment compose for Dokploy: a separate app from the TidyCode site. Set the
# domain (forms.tidycode.ai -> port 8080) and the environment variables in the
# Dokploy UI; see README.md.
#
# Dokploy runs compose with --project-directory set to the repository root, so
# paths here are relative to the root, not to this file. It writes the UI's
# variables to .env beside this file, which compose then doesn't load by itself.

services:
  forms:
    build:
      context: ./forms
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./forms/.env
    volumes:
      - forms-data:/data
    networks:
      - dokploy-network
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  forms-data:

networks:
  dokploy-network:
    external: true
