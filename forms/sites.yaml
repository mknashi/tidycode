# Sites allowed to use the forms service.
#
#   <site-id>:              lowercase id the form sends as `site`
#     name:                 shown in email subjects
#     origins:              where the form may be used (scheme://host[:port], no path)
#     to:                   address, or list of addresses, that receive messages
#     from:                 optional sender; defaults to MAIL_FROM and must be verified in SES
#     maxMessageLength:     optional, default 5000 characters
#     maxLinks:             optional, default 2 links per message
#     perHour / perDay:     optional per-IP limits, default 5 / 20
#     ratings:              optional, true to accept 1-5 star ratings (default false)
#
# Changes take effect on the next deploy.

sites:
  tidycode:
    name: TidyCode
    origins:
      - https://www.tidycode.ai
      - https://tidycode.ai
      # Desktop app (macOS/Linux and Windows webviews)
      - tauri://localhost
      - http://tauri.localhost
      # Local development
      - http://localhost:5173
    to: feedback@tidycode.ai
    ratings: true

  savet-health:
    name: Savet Health
    origins:
      - https://savet.health
    to: kodemaze@outlook.com

  savet-health-pilot:
    name: Savet Health Pilot Access
    origins:
      - https://savet.health
    to: kodemaze@outlook.com

  indiamovieguide-contact:
    name: IndiaMovieGuide Contact
    origins:
      - https://www.indiamovieguide.com
      - https://indiamovieguide.com
      - http://localhost:5173
    to: kodemaze@outlook.com

  indiamovieguide-feedback:
    name: IndiaMovieGuide Feedback
    origins:
      - https://www.indiamovieguide.com
      - https://indiamovieguide.com
      - http://localhost:5173
    to: kodemaze@outlook.com
