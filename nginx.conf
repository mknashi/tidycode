# Reproduces how Render's static hosting serves this site.
#
# Note: there is no SPA catch-all. The old public/_redirects (a Netlify /
# Cloudflare Pages convention Render never read, now deleted) declared one,
# but it was always inert in production -- unknown paths 404 there, and they
# 404 here too, which keeps Google from indexing soft 404s.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    # The apex has always redirected to www, and SITE canonicals assume it.
    # DNS for this domain is at GoDaddy with no edge rules, so it has to
    # happen here rather than at a CDN.
    if ($host = tidycode.ai) {
        return 301 https://www.tidycode.ai$request_uri;
    }

    # Traefik terminates TLS and forwards to :8080, so nginx would otherwise
    # build Location from its own scheme and port and emit
    # http://host:8080/. Relative redirects avoid leaking either.
    absolute_redirect off;

    # Temporary redirect, matching serve.js. Render
    # serves this as a 301, but the redirect is documented as temporary
    # ("until /app becomes the actual app route"), and a cached 301 would be
    # painful to undo, so the repo intent wins over the observed status.
    location = /app { return 302 /; }

    # nginx's bundled mime.types maps .js but NOT .mjs, so ES modules -- the
    # pdf.js worker, for one -- went out as application/octet-stream and the
    # browser refused to import them ("Failed to fetch dynamically imported
    # module"). Scoped to .mjs on purpose: a bare `types` block REPLACES the
    # whole MIME map rather than extending it, which once broke every content
    # type on this site.
    location ~ \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # One URL per page. Google treats /download, /download.html, /docs and
    # /docs/index.html as separate pages competing with each other, so every
    # spelling but the canonical one -- /download, /docs/ -- redirects to it.
    # These test $request_uri, the URL the client sent, and not $uri: serving
    # "/" ends in an internal redirect to /index.html, and matching that would
    # 301 "/" to itself forever.
    if ($request_uri ~ ^([^?]*/)index\.html(\?.*)?$) { return 301 $1$2; }
    if ($request_uri ~ ^([^?]*)\.html(\?.*)?$)       { return 301 $1$2; }

    # Clean URLs: /download serves download.html, /docs/ serves docs/index.html.
    # The =404 terminator is deliberate -- no SPA fallback, see note above.
    location / {
        # A directory without its trailing slash (/docs, /json-formatter)
        # redirects to the slash form, which is what the canonicals use.
        # `if` with only a rewrite inside is one of its safe uses.
        if (-d $request_filename) {
            rewrite ^(.*[^/])$ $1/ permanent;
        }
        try_files $uri $uri.html $uri/index.html $uri/ =404;
        # Applies to "/" and to every extensionless page too. A location
        # matching only \.html$ misses "/", which is the SPA entry point and
        # the page most likely to need revalidating after a deploy.
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # No `types` block here on purpose. A types block REPLACES the inherited
    # MIME map rather than extending it, so declaring one just for wasm left
    # every other file falling back to default_type application/octet-stream --
    # browsers downloaded the site instead of rendering it. nginx's bundled
    # mime.types already maps application/wasm.

    # Hashed build assets are immutable; everything else revalidates.
    # `expires` writes its own Cache-Control, so setting both emits the header
    # twice. One directive only.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;
    gzip_min_length 1024;
}
