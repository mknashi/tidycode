# Reproduces how Render's static hosting serves this site.
#
# Note: public/_redirects is NOT used. It is a Netlify / Cloudflare Pages
# convention that Render never read, so its catch-all SPA rule has been inert
# in production -- unknown paths 404 there, and they 404 here too. The rules
# below match observed production behaviour, not that file's intent.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    # The apex has always redirected to www, and SITE canonicals assume it.
    # DNS for this domain is at GoDaddy with no edge rules, so it has to
    # happen here rather than at a CDN.
    if ($host = tidycode.ai) {
        return 301 https://www.tidycode.ai$request_uri;
    }

    # Traefik terminates TLS and forwards to :8080, so nginx would otherwise
    # build Location from its own scheme and port and emit
    # http://host:8080/. Relative redirects avoid leaking either.
    absolute_redirect off;

    # Temporary redirect, matching serve.js and public/_redirects. Render
    # serves this as a 301, but the redirect is documented as temporary
    # ("until /app becomes the actual app route"), and a cached 301 would be
    # painful to undo, so the repo intent wins over the observed status.
    location = /app { return 302 /; }

    # Clean URLs: /download serves download.html, /docs serves docs/index.html.
    # The =404 terminator is deliberate -- no SPA fallback, see note above.
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
        # Applies to "/" and to every extensionless page too. A location
        # matching only \.html$ misses "/", which is the SPA entry point and
        # the page most likely to need revalidating after a deploy.
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # No `types` block here on purpose. A types block REPLACES the inherited
    # MIME map rather than extending it, so declaring one just for wasm left
    # every other file falling back to default_type application/octet-stream --
    # browsers downloaded the site instead of rendering it. nginx's bundled
    # mime.types already maps application/wasm.

    # Hashed build assets are immutable; everything else revalidates.
    # `expires` writes its own Cache-Control, so setting both emits the header
    # twice. One directive only.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;
    gzip_min_length 1024;
}
